# The same /api/ location serves plain REST calls and the SignalR notifications hub
# (/api/v1/hubs/notifications). This map keeps "Connection: upgrade" only for an actual WebSocket
# upgrade request ($http_upgrade set); any other request gets "Connection: close", the normal nginx
# recipe for a location that must support both.
map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The API, on the same origin as the app.
  location /api/ {
    proxy_pass ${API_UPSTREAM};
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 86400s;
    client_max_body_size 2m;
  }

  # Hashed build files never change: cache them hard. The shell itself must always be revalidated.
  location ~* \.(?:js|css|woff2?|svg|png|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "same-origin";
    try_files $uri /index.html;
  }
}
